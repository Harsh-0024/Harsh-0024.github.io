<style>
/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:58px;align-items:end;padding-bottom:72px}
.portrait{margin:0;aspect-ratio:3/4;max-height:520px;width:100%;background:var(--paper-2);position:relative;overflow:hidden}
.portrait img{display:block;width:100%;height:100%;object-fit:cover}
.days{position:absolute;inset:24px 24px 64px;display:grid;gap:3px;align-content:center}
.days i{display:block;aspect-ratio:1;border-radius:22%;background:var(--h0)}
.days i[data-l="1"]{background:var(--h1)} .days i[data-l="2"]{background:var(--h2)}
.days i[data-l="3"]{background:var(--h3)} .days i[data-l="4"]{background:var(--h4)}
.days i.first{box-shadow:0 0 0 2px var(--paper-2),0 0 0 3.5px var(--accent)}
.portrait figcaption{position:absolute;left:24px;right:24px;bottom:20px;font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.4}
.hero-text{display:flex;flex-direction:column;gap:24px;padding-bottom:6px;min-width:0}
.lead{font-size:clamp(17px,1.8vw,19px);line-height:1.55;color:var(--ink-2);max-width:42ch}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.aside{font-size:13.5px;color:var(--muted)}
@media (max-width:760px){
  .hero{grid-template-columns:minmax(0,1fr);gap:40px;padding-bottom:56px}
  .hero-text{order:-1;padding-bottom:0}
  /* On phones the mosaic is a wide, short band so it doesn't fill the screen */
  .portrait{max-height:none;aspect-ratio:4/3}
  .days{inset:18px 18px 52px;gap:2px}
  .days i{border-radius:18%}
  .portrait figcaption{left:18px;right:18px;bottom:16px}
}

/* "Currently building" */
.building{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;max-width:100%;font-size:13.5px;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 12px;background:var(--raised)}
.building b{font-weight:600;color:var(--ink)}
.building span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.building em{font-style:normal;color:var(--muted);white-space:nowrap;margin-left:-4px}
.building i{width:7px;height:7px;border-radius:50%;background:var(--add);position:relative;flex:none}
.building i::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--add);animation:pulse 2.4s ease-out infinite}
.building:hover{border-color:var(--ink-2)}
@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(3);opacity:0}}

/* Featured tools as swipeable cards (phones only) */
.rail,.dots{display:none}
@media (max-width:560px){
  .rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-20px;padding:4px 20px 6px;scroll-padding-inline:20px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .rail::-webkit-scrollbar{display:none}
  .rcard{flex:0 0 84%;scroll-snap-align:start;display:flex;flex-direction:column;aspect-ratio:4/5;border-radius:20px;overflow:hidden;background:#141413;text-decoration:none;color:#F1F0E9;box-shadow:0 18px 40px -22px rgba(20,20,19,.55);transition:transform .2s ease}
  .rcard:active{transform:scale(.98)}
  .rc-img{position:relative;flex:1;overflow:hidden}
  .rc-img::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(to bottom,transparent,#141413)}
  .rcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center}
  .rcard .rc-cover{position:absolute;inset:0;background:radial-gradient(120% 80% at 80% 10%,#3a3121 0%,#141413 65%)}
  .rc-days{position:absolute;left:24px;right:24px;top:24px;display:grid;gap:5px}
  .rc-days i{aspect-ratio:1;border-radius:22%;background:#4A3E1F}
  .rc-days i[data-l="2"]{background:#7C6427} .rc-days i[data-l="3"]{background:#B48E35} .rc-days i[data-l="4"]{background:#EAC567}
  .rcard .rc-text{padding:4px 20px 20px;display:flex;flex-direction:column;gap:6px}
  .rcard h3{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.1;color:#F1F0E9}
  .rcard p{font-size:14px;line-height:1.45;color:rgba(241,240,233,.78);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rcard .rc-tag{align-self:flex-start;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:#D6AF5F;border:1px solid rgba(214,175,95,.45);border-radius:999px;padding:2px 9px;margin-bottom:4px}
  .dots{display:flex;justify-content:center;gap:7px;margin-top:-10px}
  .dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .25s ease,background .25s}
  .dots i.on{width:18px;background:var(--accent)}
  #grid .work.featured{display:none}
}

/* The journey as a story, by year (phones only) */
.story{display:none}
@media (max-width:640px){
  #tl{display:none}
  #story{display:flex;flex-direction:column;gap:30px}
  .story .yr{display:grid;grid-template-columns:52px 1fr;gap:0 12px}
  .story .y{font-family:var(--serif);font-size:22px;line-height:1.1;color:var(--accent);padding-top:2px}
  .story ol{list-style:none;margin:0;padding:0 0 0 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:20px}
  .story li{position:relative}
  .story li::before{content:"";position:absolute;left:-23px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:1.5px solid var(--accent)}
  .story li.live::before{background:var(--accent)}
  .story a{display:flex;flex-direction:column;gap:3px;text-decoration:none}
  .story b{font-size:16.5px;font-weight:500}
  .story span{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .story .strip{position:relative;height:10px;margin-top:6px;background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
  .story .strip i{position:absolute;top:1px;bottom:1px;width:2px;margin-left:-1px;background:var(--accent)}
}

/* The ending */
.end{padding-block:90px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px}
.end .h2{max-width:22ch}
.end .contact{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:12px 28px;margin-top:4px}
@media (max-width:700px){.end{align-items:flex-start;text-align:left;padding-block:64px 0}.end .contact{flex-direction:column;justify-content:flex-start}}

/* Sections */
.block{padding-block:84px;display:flex;flex-direction:column;gap:30px}
@media (max-width:700px){.block{padding-block:60px}}
.statement{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(28px,3.6vw,38px);line-height:1.2;letter-spacing:-.01em;max-width:24ch}
.prose{display:flex;flex-direction:column;gap:20px;font-size:16.5px;line-height:1.65;color:var(--ink-2);max-width:560px}
.prose strong{color:var(--ink);font-weight:600}
.prose #about{display:flex;flex-direction:column;gap:20px}
.values{list-style:disc;margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:12px}
.values li::marker{color:var(--accent)}
.head{display:flex;flex-direction:column;gap:14px}
.more-link{align-self:flex-end;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);text-decoration:none}
.more-link:hover{color:var(--ink)}

/* Numbers */
.figures{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 28px}
.fig{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:16px}
.fig b{font-family:var(--serif);font-weight:400;font-size:clamp(34px,4.4vw,46px);line-height:1;letter-spacing:-.01em;font-variant-numeric:lining-nums tabular-nums}
.fig b.a{color:var(--add)} .fig b.d{color:var(--del)}
.fig span{font-size:14px;color:var(--muted)}
@media (max-width:560px){.figures{grid-template-columns:1fr 1fr;gap:26px 18px}}

/* Heatmap */
.heat{display:flex;flex-direction:column;gap:8px}
.heat-months{position:relative;height:16px;font-size:11.5px;color:var(--muted)}
.heat-months span{position:absolute;top:0;white-space:nowrap}
.heat-cells{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:3px}
.cell{aspect-ratio:1;border-radius:22%;background:var(--h0);border:0;padding:0;display:block;max-width:100%}
.cell[data-l="1"]{background:var(--h1)} .cell[data-l="2"]{background:var(--h2)}
.cell[data-l="3"]{background:var(--h3)} .cell[data-l="4"]{background:var(--h4)}
.cell.out{background:transparent}
.cell.has{cursor:pointer}
.cell.has:hover,.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.cell.today{box-shadow:0 0 0 1.5px var(--paper),0 0 0 3px var(--accent)}
@media (max-width:560px){.heat-cells{gap:2px}}
.heat-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 24px;margin:0}
.facts div{display:flex;flex-direction:column;gap:2px}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:0;font-size:16px;font-weight:500}
.facts dd span{font-weight:400;color:var(--muted);font-size:14px}
@media (max-width:560px){.facts{grid-template-columns:1fr;gap:16px}}
.day{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0 8px}
.dhead b{font-size:15px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12.5px;padding:5px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);border:0;cursor:pointer}
.drow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:11px 6px;border-bottom:1px solid var(--line);text-decoration:none}
.drow:hover{background:var(--hover)}
.drow .dp{font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap}
.drow .dm{font-size:14.5px;line-height:1.4}
.drow .dt{font-family:var(--mono);font-size:12px;color:var(--muted)}
@media (max-width:560px){.drow{grid-template-columns:minmax(0,1fr) auto}.drow .dp{grid-column:1/-1}}

/* Languages */
.langs{display:flex;flex-direction:column;gap:14px}
.lbar{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px}
.lbar i{display:block;height:100%}
.llist{display:flex;flex-wrap:wrap;gap:8px 26px;font-size:14px;color:var(--ink-2)}
.llist span{display:inline-flex;align-items:center;gap:8px}
.llist i{width:9px;height:9px;border-radius:50%}
.llist em{font-style:normal;font-family:var(--mono);font-size:12.5px;color:var(--muted)}

/* Journey */
.tl{position:relative;display:flex;flex-direction:column;--lab:200px}
.tl-axis{position:relative;height:22px;margin-left:var(--lab);font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.tl-axis span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.tl-rows{position:relative}
.tl-grid{position:absolute;top:0;bottom:0;left:var(--lab);right:0;pointer-events:none}
.tl-grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.tl-grid i.now{background:var(--accent);opacity:.7}
.tl-row{display:grid;grid-template-columns:var(--lab) 1fr;align-items:center;min-height:44px;text-decoration:none;border-top:1px solid var(--line)}
.tl-row:last-child{border-bottom:1px solid var(--line)}
.tl-row:hover{background:var(--hover)}
.tl-row .lab{font-size:14.5px;font-weight:500;padding:8px 14px 8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-row .lab small{display:block;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted)}
.track{position:relative;height:22px}
.span{position:absolute;top:50%;height:2px;margin-top:-1px;background:var(--line);min-width:3px}
.ticks{position:absolute;inset:0}
.ticks i{position:absolute;top:4px;bottom:4px;width:2px;margin-left:-1px;background:var(--accent)}
@media (max-width:640px){
  .tl{--lab:0px}
  .tl-row{grid-template-columns:1fr;padding:6px 0}
  .tl-row .lab{padding:2px 8px 2px 0;position:relative;z-index:1;justify-self:start;background:var(--paper)}
  .tl-row:hover .lab{background:var(--hover)}
  .tl-row .lab small{display:inline;margin-left:8px}
}

/* About */
.about{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:58px}
.contact{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
.contact li{display:flex;align-items:center;gap:8px}
.contact a{display:inline-flex;align-items:center;gap:12px;text-decoration:none;font-size:15.5px;color:var(--ink)}
.contact a:hover span{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.contact svg{flex:none}
.copy{border:0;background:none;padding:0 4px;font-family:var(--mono);font-size:12px;color:var(--muted);cursor:pointer}
.copy:hover{color:var(--accent)}
@media (max-width:760px){.about{grid-template-columns:1fr;gap:28px}}

/* Entrance: everything is visible at rest; this adds only a soft rise */
@media (prefers-reduced-motion:no-preference){
  .rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
  .rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.16s}.rise.d3{animation-delay:.24s}
  @keyframes rise{from{transform:translateY(8px)}to{transform:none}}
}
</style>
</head>
<body>
__HEADER__
<main>
  <section class="hero page">
    <figure class="portrait rise" id="portrait" aria-label="Portrait"></figure>
    <div class="hero-text">
      <a class="building rise" id="now" hidden></a>
      <h1 class="display rise d1" id="headline"></h1>
      <p class="lead rise d2" id="intro"></p>
      <div class="cta rise d3" id="cta"></div>
      <p class="aside rise d3" id="aside"></p>
    </div>
  </section>

  <div class="page"><hr class="rule"></div>

  <section class="block page reveal" aria-labelledby="why">
    <p class="statement" id="why"></p>
    <div class="prose">
      <p id="why-intro"></p>
      <ul class="values" id="values"></ul>
      <p id="goal"></p>
    </div>
  </section>

  <div class="page"><hr class="rule"></div>

  <section class="block page reveal" aria-labelledby="work-h" id="work">
    <div class="head"><p class="label">Recent work</p><h2 class="h2" id="work-h">Things I've built, and <strong>still use</strong></h2></div>
    <div class="rail" id="rail" aria-label="Tools I use every day"></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="grid3" id="grid"></div>
    <a class="more-link" href="/work/" id="all-work"></a>
  </section>

  <div class="page"><hr class="rule"></div>

  <section class="block page reveal" aria-labelledby="num-h" id="numbers">
    <div class="head"><p class="label">By the numbers</p><h2 class="h2" id="num-h"></h2></div>
    <div class="figures" id="figures"></div>
    <div class="heat">
      <div class="heat-months" id="heat-months"></div>
      <div class="heat-cells" id="heat"></div>
      <div class="heat-foot"><span id="heat-note"></span><span class="legend">Less <i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i> More</span></div>
    </div>
    <div class="day" id="day" hidden></div>
    <dl class="facts" id="facts"></dl>
    <div class="langs"><div class="lbar" id="lbar"></div><div class="llist" id="llist"></div></div>
  </section>

  <div class="page"><hr class="rule"></div>

  <section class="block page reveal" aria-labelledby="j-h" id="journey">
    <div class="head"><p class="label">The journey</p><h2 class="h2" id="j-h"></h2></div>
    <div class="tl" id="tl">
      <div class="tl-axis" id="tl-axis"></div>
      <div class="tl-rows" id="tl-rows"></div>
    </div>
    <div class="story" id="story"></div>
  </section>

  <div class="page"><hr class="rule"></div>

  <section class="block page reveal" aria-labelledby="me-h" id="about-me">
    <div class="about">
      <div class="head"><p class="label">More about me</p><h2 class="h2" id="me-h"></h2></div>
      <div class="prose">
        <div id="about"></div>
      </div>
    </div>
  </section>

  <section class="end page reveal" aria-labelledby="end-h" id="contact-me">
    <p class="label">Say hello</p>
    <h2 class="h2" id="end-h">Have a problem that deserves a tool? <strong>Let's talk.</strong></h2>
    <div class="cta" id="end-cta"></div>
    <ul class="contact" id="contact"></ul>
  </section>
</main>
__FOOTER__
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const PR = D.projects, ME = D.profile;
const bySlug = Object.fromEntries(PR.map(p=>[p.slug,p]));
const $ = id => document.getElementById(id);
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_L=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DOW_L=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const fmt = n => n.toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const bold = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const dayNum = s => Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10))/864e5;
const dayStr = n => new Date(n*864e5).toISOString().slice(0,10);
const niceDate = (s, year) => `${+s.slice(8,10)} ${MONTHS[+s.slice(5,7)-1]}${year? ' '+s.slice(0,4):''}`;
const monthYear = ds => `${MONTHS[+ds.slice(5,7)-1]} ${ds.slice(0,4)}`;
const dowOf = s => (new Date(dayNum(s)*864e5).getUTCDay()+6)%7;
const plural = (n, w) => `${fmt(n)} ${w}${n===1?'':'s'}`;
const hour12 = h => h===0?'midnight':h<12?h+' am':h===12?'noon':(h-12)+' pm';
const TODAY = D.today;
const recent = p => dayNum(TODAY) - dayNum(p.last) <= 30;
const span = p => `${monthYear(p.first)} – ${recent(p) ? 'now' : monthYear(p.last)}`;
const LANG_COLORS = {Python:'#3572A5',JavaScript:'#f1e05a',TypeScript:'#3178c6',HTML:'#e34c26',CSS:'#663399',Shell:'#89e051',PowerShell:'#012456','Jupyter Notebook':'#DA5B0B',Jinja:'#a52a22',Mako:'#7e858d',Dockerfile:'#384d54',Batchfile:'#C1F12E',SCSS:'#c6538c',Procfile:'#3B2F63'};
const langColor = l => LANG_COLORS[l] || '#8b8f95';
const mainLang = p => Object.entries(p.langs).sort((a,b)=>b[1]-a[1])[0]?.[0];
const level = n => !n?0: n<=2?1: n<=5?2: n<=10?3: 4;
const ghUrl = `https://github.com/${D.owner}`;

/* ---------- Tooltip and toast ---------- */
const tip = $('tip');
function showTip(e, html){ tip.innerHTML=html; tip.hidden=false; moveTip(e); }
function moveTip(e){ const x=Math.min(Math.max(e.clientX,140),innerWidth-140); tip.style.left=x+'px'; tip.style.top=e.clientY+'px'; }
function hideTip(){ tip.hidden=true; }
addEventListener('scroll', hideTip, {passive:true});
let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,1600); }

/* ---------- Commits per day, across every project ---------- */
const perDay = {}, perDayP = {};
PR.forEach(p=>Object.entries(p.days).forEach(([ds,n])=>{ perDay[ds]=(perDay[ds]||0)+n; (perDayP[ds] ||= []).push([p.slug,n]); }));
const firstDay = PR.map(p=>p.first).sort()[0];

/* ---------- Hero ---------- */
// "Currently building": the project with the newest commit, if it was recent
const newest = [...PR].sort((a,b)=>b.last.localeCompare(a.last))[0];
if(newest && dayNum(TODAY) - dayNum(newest.last) <= 14){
  const gap = dayNum(TODAY) - dayNum(newest.last);
  const when = gap===0 ? 'today' : gap===1 ? 'yesterday' : `${gap} days ago`;
  $('now').hidden = false;
  $('now').href = `/projects/${newest.slug}/`;
  $('now').innerHTML = `<i></i><span>Now building <b>${esc(newest.name)}</b></span><em>· ${when}</em>`;
  $('now').title = `Last commit ${when}`;
}
$('headline').innerHTML = bold(ME.headline);
$('intro').textContent = ME.intro;
$('cta').innerHTML = (ME.email ? `<a class="btn" href="mailto:${esc(ME.email)}">Email me</a>` : '')
  + `<a class="btn ${ME.email?'line':''}" href="/work/">See my work</a>`;
$('aside').innerHTML = `Prefer reading code? <a class="ul" href="${ghUrl}" target="_blank" rel="noopener">Everything I build is on GitHub</a>.`;
// The portrait: a photo when there is one, otherwise a square for every day since the first commit
const portrait = $('portrait');
if(ME.photo){
  portrait.innerHTML = `<img src="/${esc(ME.photo)}" alt="${esc(ME.name)}">`;
} else {
  // Until there's a photo: one square for every day I built something, oldest at the top left
  const active = Object.keys(perDay).sort();
  const cells = active.map((ds,i)=>`<i data-l="${Math.max(1,level(perDay[ds]))}" data-d="${ds}"${i===0?' class="first"':''}></i>`).join('');
  portrait.innerHTML = `<div class="days" id="days">${cells}</div><figcaption>Each square is a day I shipped something: ${fmt(active.length)} of them since ${monthYear(firstDay)}.</figcaption>`;
  portrait.setAttribute('aria-label', `${fmt(active.length)} squares, one for each day with commits since ${monthYear(firstDay)}`);
  // Pick the column count that makes the squares as big as the frame allows
  const fit = () => {
    const box = $('days'); const W = box.clientWidth, H = box.clientHeight, n = active.length;
    if(!W || !H) return;
    let best = 1, size = 0;
    for(let c=1; c<=n; c++){ const s = Math.min(W/c, H/Math.ceil(n/c)); if(s > size){ size = s; best = c; } }
    const gap = parseFloat(getComputedStyle(box).columnGap) || 3;
    box.style.gridTemplateColumns = `repeat(${best}, ${Math.floor(size-gap)}px)`;
    box.style.justifyContent = 'center';
  };
  fit(); new ResizeObserver(fit).observe(portrait);
  portrait.addEventListener('pointerover', e=>{ const c=e.target.closest('i[data-d]'); if(!c || e.pointerType==='touch') return; const ds=c.dataset.d, v=perDay[ds]||0;
    showTip(e, `<b>${v? plural(v,'commit') : 'No commits'}</b> · ${niceDate(ds,1)}${(perDayP[ds]||[]).map(([s])=>'<br>'+esc(bySlug[s].name)).join('')}`); });
  portrait.addEventListener('pointermove', e=>{ if(!tip.hidden) moveTip(e); });
  portrait.addEventListener('pointerout', hideTip);
}

/* ---------- Why I build ---------- */
$('why').textContent = ME.why;
$('why-intro').textContent = ME.why_intro;
$('values').innerHTML = (ME.values||[]).map(v=>`<li><strong>${esc(v.title)}</strong>: ${esc(v.text)}</li>`).join('');
$('goal').innerHTML = bold(ME.goal);

/* ---------- Recent work ---------- */
function work(p){
  const l = mainLang(p);
  // Phones get the phone-sized screenshot; no screenshot means a cover with the name (initials on phones)
  const img = p.shot ? `<picture><source media="(max-width:560px)" srcset="/${p.shot.replace(/\.jpg$/,'-phone.jpg')}"><img src="/${p.shot}" alt="" loading="lazy" onerror="this.closest('.pic').classList.replace('shot','noshot')"></picture>` : '';
  const initials = p.name.split(/\s+/).filter(w=>/^[A-Za-z]/.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join('');
  return `<a class="work${p.featured?' featured':''}" href="/projects/${p.slug}/">
    <span class="pic ${p.shot?'shot':'noshot'}" style="view-transition-name:vt-${p.slug}">${img}<span class="cover"><b>${esc(p.name)}</b><span>${l?`<i style="background:${langColor(l)}"></i>${esc(l)}`:''}</span><em aria-hidden="true">${esc(initials)}</em></span></span>
    <div class="txt"><h3><span>${esc(p.name)}</span><small>${p.fork?'fork · ':''}${recent(p)?'active':p.last.slice(0,4)}</small></h3>
    <p>${esc(p.tagline)}</p></div>
  </a>`;
}
const SHOW = 6;
$('grid').innerHTML = PR.slice(0,SHOW).map(work).join('');
$('all-work').textContent = PR.length > SHOW ? `See all ${PR.length} projects →` : 'See all work →';

// On phones the tools I use every day are big cards you swipe through
const feats = PR.filter(p=>p.featured);
$('rail').innerHTML = feats.map(p=>{
  const img = p.shot ? `<img src="/${p.shot.replace(/\.jpg$/,'-phone.jpg')}" alt="" loading="lazy" onerror="this.remove()">` : '';
  const initials = p.name.split(/\s+/).filter(w=>/^[A-Za-z]/.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join('');
  return `<a class="rcard" href="/projects/${p.slug}/" style="view-transition-name:vt-${p.slug}">
    <span class="rc-img"><span class="rc-cover">${p.shot ? '' : (()=>{
      // No screenshot: the cover is this project's own mosaic of building days
      const ds = Object.keys(p.days).sort().slice(-96), cols = Math.max(8, Math.ceil(Math.sqrt(ds.length*0.8)));
      return `<span class="rc-days" style="grid-template-columns:repeat(${cols},1fr)">${ds.map(d=>`<i data-l="${Math.max(1,level(p.days[d]))}"></i>`).join('')}</span>`;
    })()}</span>${img}</span>
    <span class="rc-text">${recent(p)?'<span class="rc-tag">in use · active</span>':'<span class="rc-tag">in use</span>'}<h3>${esc(p.name)}</h3><p>${esc(p.tagline)}</p></span>
  </a>`;
}).join('');
$('dots').innerHTML = feats.map((_,i)=>`<i${i===0?' class="on"':''}></i>`).join('');
$('rail').addEventListener('scroll', ()=>{
  const rail = $('rail'), card = rail.firstElementChild; if(!card) return;
  const i = Math.round(rail.scrollLeft / (card.offsetWidth + 14));
  [...$('dots').children].forEach((d,k)=>d.classList.toggle('on', k===Math.min(i, feats.length-1)));
}, {passive:true});

/* ---------- Numbers ---------- */
const totalCommits = PR.reduce((s,p)=>s+p.commits,0);
const added = PR.reduce((s,p)=>s+p.added,0), removed = PR.reduce((s,p)=>s+p.removed,0);
const langBytes = {}; PR.forEach(p=>Object.entries(p.langs).forEach(([l,b])=>langBytes[l]=(langBytes[l]||0)+b));
const langTotal = Object.values(langBytes).reduce((a,b)=>a+b,0);
const langs = Object.entries(langBytes).sort((a,b)=>b[1]-a[1]).map(([l,b])=>[l,b/langTotal*100]);
const shownLangs = langs.filter(([,p])=>p>=1);
$('num-h').innerHTML = `<strong>${fmt(totalCommits)} commits</strong> across ${PR.length} projects.`;
$('figures').innerHTML = [
  [fmt(totalCommits),'Commits'],
  [PR.length,'Projects'],
  [Object.keys(perDay).length,'Days of building'],
  [`+${fmt(added)}`,'Lines committed','a'],
  [`−${fmt(removed)}`,'Lines removed','d'],
  [shownLangs.length,'Languages'],
].map(([v,k,c])=>`<div class="fig"><b class="${c||''}">${v}</b><span>${k}</span></div>`).join('');
// The numbers count up the first time they scroll into view
if('IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches){
  const figs = $('figures');
  const io = new IntersectionObserver(entries=>{
    if(!entries.some(e=>e.isIntersecting)) return;
    io.disconnect();
    figs.querySelectorAll('b').forEach(b=>{
      const text = b.textContent, m = text.match(/^(\D*)([\d,]+)(.*)$/); if(!m) return;
      const goal = +m[2].replace(/,/g,''), t0 = performance.now(), dur = 1100;
      const tick = now => {
        const k = Math.min(1, (now-t0)/dur), eased = 1 - Math.pow(1-k, 3);
        b.textContent = m[1] + fmt(Math.round(goal*eased)) + m[3];
        if(k < 1) requestAnimationFrame(tick); else b.textContent = text;
      };
      requestAnimationFrame(tick);
    });
  }, {threshold:.35});
  io.observe(figs);
}

// Heatmap: the last 12 months, or the last 6 on a phone so each day is big enough to see
const phone = matchMedia('(max-width:560px)').matches;
const weeks = phone ? 26 : 53;
const end = dayNum(TODAY) + (6-dowOf(TODAY));
const start = end - weeks*7 + 1, yearStart = dayNum(TODAY) - 364;
const heat = $('heat');
heat.style.gridTemplateColumns = `repeat(${weeks},1fr)`;
let cells='', mh='', lastM=-1, yearCommits=0;
for(let w=0; w<weeks; w++){
  for(let d=0; d<7; d++){
    const n = start + w*7 + d, ds = dayStr(n);
    if(n>dayNum(TODAY)){ cells+='<i class="cell out"></i>'; continue; }
    const v = perDay[ds]||0; yearCommits += v;
    cells += v ? `<button type="button" class="cell has${ds===TODAY?' today':''}" data-l="${level(v)}" data-d="${ds}" aria-label="${plural(v,'commit')}, ${DOW_L[dowOf(ds)]} ${niceDate(ds,1)}"></button>`
               : `<i class="cell${ds===TODAY?' today':''}" data-l="0" data-d="${ds}"></i>`;
  }
  const mon = dayStr(start+w*7), m=+mon.slice(5,7);
  if(+mon.slice(8,10)<=7 && m!==lastM && w<weeks-2){ mh += `<span style="left:${w/weeks*100}%">${MONTHS[m-1]}</span>`; lastM=m; }
}
heat.innerHTML = cells; $('heat-months').innerHTML = mh;
$('heat-note').textContent = `${fmt(yearCommits)} commits in the last ${phone ? '6' : '12'} months`;
heat.addEventListener('pointerover', e=>{ const c=e.target.closest('.cell[data-d]'); if(!c || e.pointerType==='touch') return; const ds=c.dataset.d;
  const list = (perDayP[ds]||[]).map(([s,n])=>`${esc(bySlug[s].name)} · ${n}`).join('<br>');
  showTip(e, `<b>${perDay[ds]? plural(perDay[ds],'commit') : 'No commits'}</b> · ${DOW[dowOf(ds)]} ${niceDate(ds,1)}${list?'<br>'+list:''}`); });
heat.addEventListener('pointermove', e=>{ if(!tip.hidden) moveTip(e); });
heat.addEventListener('pointerout', hideTip);
let selDay = null;
function showDay(ds){
  selDay = ds;
  document.querySelectorAll('.cell.sel').forEach(c=>c.classList.remove('sel'));
  if(!ds){ $('day').hidden = true; return; }
  document.querySelector(`.cell[data-d="${ds}"]`)?.classList.add('sel');
  const rows = D.feed.filter(r=>r[3].slice(0,10)===ds);
  $('day').innerHTML = `<div class="dhead"><b>${DOW_L[dowOf(ds)]}, ${niceDate(ds,1)} · ${plural(rows.length,'commit')}</b><button class="chip" type="button" id="day-x">Close ✕</button></div>`
    + rows.map(([s,h,H,dt,msg])=>`<a class="drow" href="https://github.com/${D.owner}/${esc(bySlug[s].repo)}/commit/${H}" target="_blank" rel="noopener"><span class="dp">${esc(bySlug[s].name)}</span><span class="dm">${esc(msg)}</span><span class="dt">${dt.slice(11,16)}</span></a>`).join('');
  $('day').hidden = false;
  $('day-x').addEventListener('click', ()=>showDay(null));
}
heat.addEventListener('click', e=>{ const c=e.target.closest('.cell.has'); if(!c) return; hideTip(); showDay(selDay===c.dataset.d ? null : c.dataset.d); });

const hrs = Array(24).fill(0);
D.feed.forEach(r=>{ hrs[+r[3].slice(11,13)]++; });
const busiest = Object.entries(perDay).sort((a,b)=>b[1]-a[1])[0];
const yearOf = p => Object.entries(p.days).filter(([d])=>dayNum(d)>=yearStart).reduce((s,[,n])=>s+n,0);
const mostActive = [...PR].sort((a,b)=>yearOf(b)-yearOf(a))[0];
$('facts').innerHTML = [
  ['Most worked on', esc(mostActive.name), 'this year'],
  ['Busiest day', plural(busiest[1],'commit'), niceDate(busiest[0],1)],
  ['Favourite hour', hour12(hrs.indexOf(Math.max(...hrs))), D.zone],
].map(([k,v,s])=>`<div><dt>${k}</dt><dd>${v}${s?` <span>${s}</span>`:''}</dd></div>`).join('');

const other = 100 - shownLangs.reduce((s,[,p])=>s+p,0);
const lrows = other>0.05 ? [...shownLangs, ['Other', other]] : shownLangs;
$('lbar').innerHTML = lrows.map(([l,p])=>`<i style="width:${p}%;background:${l==='Other'?'var(--line)':langColor(l)}" title="${esc(l)} ${p.toFixed(1)}%"></i>`).join('');
$('llist').innerHTML = lrows.map(([l,p])=>`<span><i style="background:${l==='Other'?'var(--line)':langColor(l)}"></i>${esc(l)} <em>${p<1?'<1':Math.round(p)}%</em></span>`).join('');

/* ---------- Journey ---------- */
const t0 = dayNum(firstDay.slice(0,7)+'-01'), t1 = dayNum(TODAY)+10;
const pos = ds => ((dayNum(ds)-t0)/(t1-t0)*100);
const byStart = [...PR].sort((a,b)=>a.first.localeCompare(b.first));
let axis='', grid='';
for(let y=+firstDay.slice(0,4); y<=+TODAY.slice(0,4); y++){
  for(let m=0; m<12; m+=6){
    const ds = `${y}-${String(m+1).padStart(2,'0')}-01`;
    if(dayNum(ds)<t0 || dayNum(ds)>t1) continue;
    grid += `<i style="left:${pos(ds)}%"></i>`;
    if(m===0) axis += `<span style="left:${pos(ds)}%">${y}</span>`;
  }
}
grid += `<i class="now" style="left:${pos(TODAY)}%"></i>`;
$('tl-axis').innerHTML = axis;
$('tl-rows').innerHTML = `<div class="tl-grid">${grid}</div>` + byStart.map(p=>{
  const ticks = Object.keys(p.days).map(ds=>`<i style="left:${pos(ds)}%;opacity:${Math.min(1,.35+p.days[ds]/8)}"></i>`).join('');
  return `<a class="tl-row" href="/projects/${p.slug}/" data-s="${p.slug}">
    <span class="lab">${esc(p.name)}<small>${span(p)}</small></span>
    <span class="track"><span class="span" style="left:${pos(p.first)}%;width:${Math.max(.4,pos(p.last)-pos(p.first))}%"></span><span class="ticks">${ticks}</span></span>
  </a>`;
}).join('');
$('tl-rows').addEventListener('pointerover', e=>{ const r=e.target.closest('.tl-row'); if(!r || e.pointerType==='touch') return; const p=bySlug[r.dataset.s];
  showTip(e, `<b>${esc(p.name)}</b><br>${span(p)} · ${plural(Object.keys(p.days).length,'day')} of work · ${plural(p.commits,'commit')}`); });
$('tl-rows').addEventListener('pointermove', e=>{ if(!tip.hidden) moveTip(e); });
$('tl-rows').addEventListener('pointerout', e=>{ if(!e.relatedTarget?.closest?.('.tl-row')) hideTip(); });
// On phones the journey reads as a story: one entry per project, grouped by the year it started
const byYear = {};
byStart.forEach(p=>{ (byYear[p.first.slice(0,4)] ||= []).push(p); });
$('story').innerHTML = Object.entries(byYear).map(([y, list])=>`<div class="yr"><span class="y">${y}</span><ol>${list.map(p=>{
  const ticks = Object.keys(p.days).map(ds=>`<i style="left:${pos(ds)}%;opacity:${Math.min(1,.35+p.days[ds]/8)}"></i>`).join('');
  return `<li class="${recent(p)?'live':''}"><a href="/projects/${p.slug}/"><b>${esc(p.name)}</b><span>${span(p)} · ${plural(p.commits,'commit')}</span><span class="strip">${ticks}</span></a></li>`;
}).join('')}</ol></div>`).join('');
$('j-h').innerHTML = `${PR.length} projects over ${Math.max(1,Math.round((dayNum(TODAY)-dayNum(firstDay))/30.4))} months, <strong>oldest first</strong>.`;

/* ---------- About ---------- */
$('me-h').innerHTML = `Building since <strong>${MONTHS_L[+firstDay.slice(5,7)-1]} ${firstDay.slice(0,4)}</strong>.`;
$('about').innerHTML = (ME.about||[]).map(t=>`<p>${bold(t)}</p>`).join('');
const MAIL_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg>';
const GH_ICON = '<svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>';
$('contact').innerHTML = (ME.email ? `<li><a href="mailto:${esc(ME.email)}">${MAIL_ICON}<span>${esc(ME.email)}</span></a><button class="copy" type="button" id="copy-mail">copy</button></li>` : '')
  + `<li><a href="${ghUrl}" target="_blank" rel="noopener">${GH_ICON}<span>github.com/${esc(D.owner)}</span></a></li>`;
$('end-cta').innerHTML = (ME.email ? `<a class="btn" href="mailto:${esc(ME.email)}">Email me</a>` : '') + `<a class="btn line" href="${ghUrl}" target="_blank" rel="noopener">See my GitHub</a>`;
$('copy-mail')?.addEventListener('click', ()=>{
  navigator.clipboard.writeText(ME.email).then(()=>toast('Email address copied')).catch(()=>{
    const r=document.createRange(); r.selectNodeContents(document.querySelector('.contact a span')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); });
});
})();
</script>
</body>
